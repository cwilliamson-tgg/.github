name: Sync Issue Templates

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:        # Manual trigger button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4
        with:
          path: org-github
          
      - name: Debug checkout
        run: |
          echo "=== org-github contents ==="
          ls -la org-github/
          echo "=== ISSUE_TEMPLATE contents ==="
          ls -la org-github/.github/ISSUE_TEMPLATE/ || echo "NOT FOUND"
          
      - name: Sync templates to all repos
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          repos=$(gh repo list cwilliamson-tgg \
            --json name \
            --limit 100 \
            -q '.[].name')

          for repo in $repos; do
            if [ "$repo" = ".github" ]; then
              echo "Skipping .github"
              continue
            fi

            echo "Checking $repo..."

            gh repo clone cwilliamson-tgg/$repo \
              /tmp/$repo -- --quiet 2>/dev/null || true

            # Skip empty repos
            if [ ! -f "/tmp/$repo/README.md" ] && \
               [ -z "$(ls -A /tmp/$repo 2>/dev/null)" ]; then
              echo "Skipping empty repo: $repo"
              rm -rf /tmp/$repo
              continue
            fi

            # Skip if templates already exist
            if [ -d "/tmp/$repo/.github/ISSUE_TEMPLATE" ]; then
              echo "Templates exist in $repo, skipping"
              rm -rf /tmp/$repo
              continue
            fi

            # Copy templates
            mkdir -p /tmp/$repo/.github/ISSUE_TEMPLATE
            cp org-github/.github/ISSUE_TEMPLATE/*.md \
               /tmp/$repo/.github/ISSUE_TEMPLATE/

            cd /tmp/$repo
            git config user.email "github-actions@github.com"
            git config user.name "Tuesday Guild Bot"
            git add .github/ISSUE_TEMPLATE/
            git diff --staged --quiet && \
              echo "No changes in $repo" || \
              (git commit -m "chore: add org issue templates" \
               && git push \
               && echo "✅ Updated $repo")

            cd -
            rm -rf /tmp/$repo
          done
