name: Sync Issue Templates to All Repos

on:
  push:
    paths:
      - 'ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync templates to all repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # List all repos in org
          repos=$(gh repo list cwilliamson-tgg --json name -q '.[].name')
          
          for repo in $repos; do
            # Skip the .github repo itself
            if [ "$repo" = ".github" ]; then continue; fi
            
            echo "Syncing templates to $repo..."
            
            # Clone repo
            gh repo clone cwilliamson-tgg/$repo /tmp/$repo
            
            # Copy templates
            mkdir -p /tmp/$repo/.github/ISSUE_TEMPLATE
            cp ISSUE_TEMPLATE/*.md /tmp/$repo/.github/ISSUE_TEMPLATE/
            
            # Commit and push if anything changed
            cd /tmp/$repo
            git config user.email "github-actions@github.com"
            git config user.name "GitHub Actions"
            git add .github/ISSUE_TEMPLATE/
            git diff --staged --quiet || git commit -m "chore: sync issue templates from org .github"
            git push
            cd -
          done