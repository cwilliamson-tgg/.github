name: Repo Setup and Sync
on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:        # Manual trigger button
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4
        with:
          path: org-github

      - name: Sync templates to all repos
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          repos=$(gh repo list cwilliamson-tgg \
            --json name \
            --limit 100 \
            -q '.[].name')
          for repo in $repos; do
            if [ "$repo" = ".github" ]; then
              echo "Skipping .github"
              continue
            fi
            echo "Checking $repo..."
            gh repo clone cwilliamson-tgg/$repo \
              /tmp/$repo -- --quiet 2>/dev/null || true
            # Skip empty repos
            if [ ! -f "/tmp/$repo/README.md" ] && \
               [ -z "$(ls -A /tmp/$repo 2>/dev/null)" ]; then
              echo "Skipping empty repo: $repo"
              rm -rf /tmp/$repo
              continue
            fi
            # Skip if templates already exist
            if [ -d "/tmp/$repo/.github/ISSUE_TEMPLATE" ]; then
              echo "Templates exist in $repo, skipping"
              rm -rf /tmp/$repo
              continue
            fi
            # Copy templates
            mkdir -p /tmp/$repo/.github/ISSUE_TEMPLATE
            cp org-github/.github/ISSUE_TEMPLATE/*.md \
               /tmp/$repo/.github/ISSUE_TEMPLATE/
            cd /tmp/$repo
            git remote set-url origin \
              https://x-access-token:$GH_TOKEN@github.com/cwilliamson-tgg/$repo.git
            git config user.email "github-actions@github.com"
            git config user.name "Tuesday Guild Bot"
            git add .github/ISSUE_TEMPLATE/
            git diff --staged --quiet && \
              echo "No changes in $repo" || \
              (git commit -m "chore: add org issue templates" \
               && git push \
               && echo "✅ Updated $repo")
            cd -
            rm -rf /tmp/$repo

      - name: Set branch protection
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          repos=$(gh repo list cwilliamson-tgg \
            --json name \
            --limit 100 \
            -q '.[].name')

          for repo in $repos; do
            if [ "$repo" = ".github" ]; then
              echo "Skipping .github"
              continue
            fi

            echo "Setting branch protection on $repo..."

            # Check if main branch exists
            default_branch=$(gh repo view cwilliamson-tgg/$repo \
              --json defaultBranchRef \
              -q '.defaultBranchRef.name' 2>/dev/null)

            if [ -z "$default_branch" ]; then
              echo "No default branch in $repo, skipping"
              continue
            fi

            # Set branch protection via API
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              /repos/cwilliamson-tgg/$repo/branches/$default_branch/protection \
              -f required_status_checks='null' \
              -F enforce_admins=false \
              -f required_pull_request_reviews='{"required_approving_review_count":1,"dismiss_stale_reviews":true}' \
              -f restrictions='null' \
              -F allow_force_pushes=false \
              -F allow_deletions=false \
              && echo "✅ Protected $repo/$default_branch" \
              || echo "⚠️ Could not protect $repo (may need admin access)"
          done
