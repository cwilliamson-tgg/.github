name: Repo Setup and Sync
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4
        with:
          path: org-github

      - name: Sync templates to all repos
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          repos=$(gh repo list cwilliamson-tgg \
            --json name \
            --limit 100 \
            -q '.[].name')
          for repo in $repos; do
            if [ "$repo" = ".github" ]; then
              echo "Skipping .github"
              continue
            fi
            echo "Checking $repo..."
            gh repo clone cwilliamson-tgg/$repo \
              /tmp/$repo -- --quiet 2>/dev/null || true
            if [ ! -f "/tmp/$repo/README.md" ] && \
               [ -z "$(ls -A /tmp/$repo 2>/dev/null)" ]; then
              echo "Skipping empty repo: $repo"
              rm -rf /tmp/$repo
              continue
            fi
            if [ -d "/tmp/$repo/.github/ISSUE_TEMPLATE" ]; then
              echo "Templates exist in $repo, skipping"
              rm -rf /tmp/$repo
              continue
            fi
            mkdir -p /tmp/$repo/.github/ISSUE_TEMPLATE
            cp org-github/.github/ISSUE_TEMPLATE/*.md \
               /tmp/$repo/.github/ISSUE_TEMPLATE/
            cd /tmp/$repo
            git remote set-url origin \
              https://x-access-token:$GH_TOKEN@github.com/cwilliamson-tgg/$repo.git
            git config user.email "github-actions@github.com"
            git config user.name "Tuesday Guild Bot"
            git add .github/ISSUE_TEMPLATE/
            git diff --staged --quiet && \
              echo "No changes in $repo" || \
              (git commit -m "chore: add org issue templates" \
               && git push \
               && echo "✅ Updated $repo")
            cd -
            rm -rf /tmp/$repo
          done

      - name: Set branch ruleset
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          repos=$(gh repo list cwilliamson-tgg \
            --json name \
            --limit 100 \
            -q '.[].name')
          for repo in $repos; do
            if [ "$repo" = ".github" ]; then
              echo "Skipping .github"
              continue
            fi
            echo "Setting ruleset on $repo..."
            default_branch=$(gh repo view cwilliamson-tgg/$repo \
              --json defaultBranchRef \
              -q '.defaultBranchRef.name' 2>/dev/null)
            if [ -z "$default_branch" ]; then
              echo "No default branch in $repo, skipping"
              continue
            fi
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/cwilliamson-tgg/$repo/rulesets \
              --input - <<EOF
{
  "name": "Protect $default_branch",
  "target": "branch",
  "enforcement": "active",
  "conditions": {
    "ref_name": {
      "include": ["refs/heads/$default_branch"],
      "exclude": []
    }
  },
  "rules": [
    { "type": "deletion" },
    { "type": "non_fast_forward" },
    {
      "type": "pull_request",
      "parameters": {
        "required_approving_review_count": 1,
        "dismiss_stale_reviews_on_push": true,
        "require_code_owner_review": false,
        "require_last_push_approval": false,
        "required_review_thread_resolution": false
      }
    }
  ],
  "bypass_actors": [
    {
      "actor_id": 5,
      "actor_type": "RepositoryRole",
      "bypass_mode": "always"
    }
  ]
}
EOF
            echo "✅ Ruleset applied to $repo/$default_branch"
          done
